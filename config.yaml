# Which Google Calendar to write into. Recommended: create a dedicated
# calendar (not your main one) so it's safe to wipe/resync.
google_calendar:
  # Set via the GOOGLE_CALENDAR_ID env var instead (see .env.example) --
  # this is a per-person value, so it doesn't belong in tracked config.
  # This placeholder is only a fallback for `calendar_id_env` being unset.
  calendar_id: ""
  calendar_id_env: "GOOGLE_CALENDAR_ID"
  # Produced by `python -m src.auth_setup` (see README) -- an OAuth refresh
  # token, not a service-account key (Google now blocks creating those by
  # default on new GCP projects).
  token_file: "token.json"

# Popup reminder lead times per event category, in minutes before start.
# Empty list = no extra reminder for that category.
reminders_minutes_before:
  assignment: [4320, 1440] # Canvas deadlines: 3 days + 1 day before
  registration: [10080, 1440] # Ladok registration deadlines: 7 days + 1 day before
  exam: [10080, 1440] # Exams: 7 days + 1 day before
  class: [] # TimeEdit lectures/etc: no extra popup

canvas:
  # Name of the env var (and GitHub Actions secret) holding your Canvas
  # calendar feed ICS URL. Find it on the Canvas Calendar page -> "Calendar
  # Feed" link at the bottom.
  ics_url_env: "CANVAS_ICS_URL"

timeedit:
  # Name of the env var holding your TimeEdit *subscription* ICS URL (must
  # be fetchable via plain HTTP GET, not a one-off manual download).
  ics_url_env: "TIMEEDIT_ICS_URL"
  # Swedish -> English overrides/additions on top of the defaults in
  # src/normalize.py, for the activity-type words (Föreläsning, Aktivitet
  # values, etc). Add terms here as you see ones the defaults miss.
  translations:
    Djup maskininlärning: Deep Machine Learning
    Etisk hackning och penetrationstestning: Ethical Hacking and Penetration Testing
  # Short-course-code -> display-name, always used for the course name in
  # the title -- this takes priority over whatever Name/Namn value (if any)
  # the feed itself sends, since TimeEdit's SUMMARY layout has changed
  # shape between runs of the very same feed URL (sometimes with a name,
  # sometimes without). Pinning it here is what keeps titles stable
  # regardless of which variant TimeEdit happens to send. Codes are as they
  # appear after "Kurskod:"/"Course code:", truncated at the first "_"
  # (e.g. "SSY340_50_HT26_35125" -> "SSY340") -- run --dry-run to see the
  # codes your feed actually uses, and add a line here for each new course.
  course_names:
    DIT969GU: Deep Machine Learning
    SSY340: Deep Machine Learning
    DAT370: Ethical Hacking and Penetration Testing
    DIT989GU: Ethical Hacking and Penetration Testing

ladok:
  # Not wired up yet -- see src/sources/ladok.py.
  enabled: false
